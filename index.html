    <script>
      // Gracefully ignore WebSocket/HMR reconnection errors per AI Studio environment constraints
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (e.reason.message?.includes('WebSocket') || e.reason.stack?.includes('@vite/client') || e.reason.stack?.includes('createWebSocketModuleRunnerTransport'))) {
          e.preventDefault();
        }
      });
      window.addEventListener('error', function(e) {
        if (e.message?.includes('WebSocket') || e.filename?.includes('@vite/client')) {
          e.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-900 text-slate-800 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
